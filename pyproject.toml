[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nimo"
version = "0.1.0"
description = "AI QA engineer for Android — reproduce bugs, discover crashes, and prove coverage from just an APK."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "datum-router" }]
keywords = ["android", "qa", "llm", "testing", "gui", "coverage", "adb"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

# The engine is STDLIB-ONLY by design: the LLM client uses urllib, the device
# layer uses subprocess+adb, UI parsing uses xml.etree. Nothing here at import
# time. Heavier capabilities are opt-in extras below, imported lazily.
dependencies = []

[project.optional-dependencies]
# Static APK analysis (manifest, activities, permissions) — agent/apkmeta.py
# imports this lazily, so it is only needed for APK-derived features.
apk = ["androguard>=4.0"]
# Annotated-screenshot encoding for vision backends.
vision = ["Pillow>=10"]
# Everything a contributor needs.
dev = ["pytest>=8", "pytest-cov", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
nimo = "nimo.cli:main"

[project.urls]
Homepage = "https://github.com/datum-router/nimo"
Issues = "https://github.com/datum-router/nimo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nimo"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["_build", "site", "worker"]

[tool.ruff.lint]
# Pragmatic set: real errors, not style churn on ported research code.
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
# The ported engine is not fully annotated yet; tighten per-module over time.
check_untyped_defs = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
