# nimo on-demand test — triggered from the nimo.run page (or manually).
#
# Full setup, no human in the loop:
#   1. Probe for binder -> boot redroid (Android in Docker) if available,
#      else fall back to the standard Android emulator.
#   2. Fetch the APK (demo APK from this repo, or a customer-supplied URL).
#   3. Run the nimo pipeline (repro / discover / full).
#   4. Stream progress + screenshots to the `live` branch while running.
#   5. Write summary.json (verdict + customer note) for the results UI.
#
# Public repo = unlimited free Actions minutes.

name: nimo on-demand test

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android version (redroid image) — auto picks from the APK"
        type: choice
        default: "auto"
        options:
          ["auto", "16.0.0", "15.0.0", "14.0.0", "13.0.0", "12.0.0",
           "11.0.0", "10.0.0", "9.0.0", "8.1.0"]
      arch:
        description: "CPU architecture — auto picks from the APK's native libs"
        type: choice
        default: "auto"
        options: ["auto", "amd64", "arm64"]
      mode:
        description: "Test mode"
        type: choice
        default: "pipeline"
        options: ["pipeline", "repro", "discover"]
      apk_source:
        description: "Demo APK id (e.g. 01-notepad) or https URL to an APK"
        default: "01-notepad"
      bug_report:
        description: "Bug report markdown (repro mode)"
        type: string
        default: ""
      max_minutes:
        description: "Max crawl time (minutes)"
        default: "20"

permissions:
  contents: write   # push progress/summary to the `live` branch

jobs:
  test:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      RUN_ID: ${{ github.run_id }}
      LIVE_BRANCH: live
      # LLM provider override (all optional — unset = Pollinations free tier).
      # Add values as repo secrets: Settings → Secrets and variables →
      # Actions → New repository secret. Never commit keys.
      NIMO_BASE_URL: ${{ secrets.NIMO_BASE_URL }}
      NIMO_API_KEY: ${{ secrets.NIMO_API_KEY }}
      NIMO_MODEL: ${{ secrets.NIMO_MODEL }}
    steps:
      - uses: actions/checkout@v4

      # androguard pulls a sizeable dependency tree, re-downloaded on every
      # run: 23s measured in run #30, second only to the emulator boot in
      # pre-test cost. Keyed on pyproject.toml so a dependency change
      # invalidates it rather than serving a stale wheel set.
      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ runner.arch }}-

      - name: Install adb + nimo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-tools-adb
          # Installs the `nimo` CLI plus the APK-analysis extra (androguard).
          pip install -q -e ".[apk]"

      # ---- device: redroid if binder exists, emulator otherwise ----
      # ---- test inputs (before device boot: preflight fails fast) ----
      - name: Fetch APK
        run: |
          SRC="${{ inputs.apk_source }}"
          DEMO_DIR=""
          if [[ "$SRC" == http* ]]; then
            curl -fsSL --max-time 300 -o app.apk "$SRC"
          elif [[ -f "demo/$SRC/app.apk" ]]; then
            DEMO_DIR="demo/$SRC"
            cp "$DEMO_DIR/app.apk" app.apk
          else
            # tolerate bare names ("notepad" -> "demo/01-notepad")
            match=(demo/*-"$SRC"/app.apk)
            if [[ -f "${match[0]}" ]]; then
              DEMO_DIR="$(dirname "${match[0]}")"
              cp "${match[0]}" app.apk
            else
              echo "unknown apk_source '$SRC' — valid demo ids:"
              ls demo/
              exit 1
            fi
          fi
          # Every demo ships its own bug report. Stash it so repro mode works
          # on a demo APK without the caller having to paste one in.
          if [[ -n "$DEMO_DIR" && -f "$DEMO_DIR/bug_report.md" ]]; then
            cp "$DEMO_DIR/bug_report.md" demo_bug_report.md
            echo "demo bug report available: $DEMO_DIR/bug_report.md"
          fi
          python3 -c "import zipfile; z=zipfile.ZipFile('app.apk'); print('apk ok:', len(z.namelist()), 'entries')"

      - name: Preflight APK
        run: |
          nimo preflight app.apk

      # Customer leaves version/arch on "auto" (the default): derive both
      # from the APK itself. A pinned version that the APK cannot install
      # on fails fast here instead of dying 10 minutes into the boot.
      - name: Resolve environment
        id: env
        env:
          WANT_VERSION: ${{ inputs.android_version }}
          WANT_ARCH: ${{ inputs.arch }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import os, sys
          from nimo.engine.preflight import recommend_env, VERSION_API
          rec = recommend_env("app.apk")
          ver = os.environ["WANT_VERSION"]
          arch = os.environ["WANT_ARCH"]
          if ver == "auto":
              ver = rec["android_version"]
          elif VERSION_API[ver] > rec["max_api"]:
              print(f"::error::Android {ver} (API {VERSION_API[ver]}) cannot "
                    f"install this APK (max API {rec['max_api']}). "
                    "Use android_version=auto.")
              sys.exit(1)
          if arch == "auto":
              arch = rec["arch"]
          # AOSP 'default' images boot noticeably faster and download
          # smaller than google_apis — use them unless the APK needs GMS.
          target = "google_apis" if rec["uses_gms"] else "default"
          print(f"android_version={ver}")
          print(f"api_level={VERSION_API[ver]}")
          print(f"arch={arch}")
          print(f"target={target}")
          for i, why in enumerate(rec["reasons"]):
              print(f"reason{i}={why}")
          EOF
          grep -E "^(android_version|api_level|arch|target|reason)" "$GITHUB_OUTPUT" | tail -9

      - name: Validate inputs
        run: |
          if [ "${{ steps.env.outputs.arch }}" = "arm64" ]; then
            echo "::error::this APK ships ARM-only native libraries — amd64 runners cannot execute them. arm64 needs a self-hosted ARM runner with binder; GitHub-hosted ARM runners lack the kernel module."
            exit 1
          fi
          if [ "${{ inputs.mode }}" = "repro" ] && [ -z "${{ inputs.bug_report }}" ] && [ ! -f demo_bug_report.md ]; then
            echo "::error::repro mode needs a bug report — paste one, or pick a demo APK (each demo ships its own)."
            exit 1
          fi

      # ---- live progress channel (branch `live`, dir run-<id>) ----
      - name: Write bug report
        id: bug
        env:
          # Passed through the environment, never interpolated into the shell
          # script: a bug report is untrusted text and may contain quotes or $(…).
          BUG_REPORT: ${{ inputs.bug_report }}
        run: |
          if [ -n "$BUG_REPORT" ]; then
            printf '%s' "$BUG_REPORT" > bug_report.md
            echo "using the bug report supplied with the dispatch"
          elif [ -f demo_bug_report.md ] && [ "${{ inputs.mode }}" != "discover" ]; then
            # `--bug` selects targeted reproduction, so only fall back to the
            # demo's report in modes that actually want it. discover mode is
            # meant to explore blind and must not be turned into a repro run.
            cp demo_bug_report.md bug_report.md
            echo "using the demo's own bug report"
          fi
          if [ -s bug_report.md ]; then
            echo "has_bug=true" >> "$GITHUB_OUTPUT"
            wc -l bug_report.md
          else
            echo "has_bug=false" >> "$GITHUB_OUTPUT"
            echo "no bug report — discover/pipeline mode will explore instead"
          fi

      - name: Prepare live branch
        run: |
          rm -rf /tmp/live && mkdir -p /tmp/live && cd /tmp/live
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q origin "$LIVE_BRANCH" 2>/dev/null && git checkout -q "$LIVE_BRANCH" || git checkout -q --orphan "$LIVE_BRANCH"
          git config user.name "nimo-live"
          git config user.email "nimo-live@users.noreply.github.com"
          mkdir -p "run-$RUN_ID"
          echo "$RUN_ID" > /tmp/run_id
          # publish an immediate heartbeat so the web UI shows life within
          # a minute of dispatch — long before the emulator finishes booting
          python3 -c "
          import json, datetime
          json.dump({'status':'running','phase':'booting device','visited':0,
                     'total':0,'current_activity':'','screens':[],'actions':[],
                     'updated_at':datetime.datetime.now(datetime.timezone.utc).isoformat()},
                    open('run-$RUN_ID/progress.json','w'))"
          git add "run-$RUN_ID"
          git commit -qm "run $RUN_ID starting"
          git push -q origin "$LIVE_BRANCH" || true

      - name: Probe for binder (redroid requirement)
        id: binder
        run: |
          if sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null && ls /dev/binder* >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "binder present — using redroid"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::binder kernel module unavailable — falling back to the standard Android emulator"
          fi

      - name: Boot redroid
        if: steps.binder.outputs.available == 'true'
        run: |
          docker run -d --rm --privileged \
            --name nimo-redroid \
            -p 5555:5555 \
            redroid/redroid:${{ steps.env.outputs.android_version }}-latest \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=1920 \
            androidboot.redroid_dpi=420
          echo "ANDROID_SERIAL=localhost:5555" >> "$GITHUB_ENV"
          echo "RUNTIME=redroid" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            adb connect localhost:5555 >/dev/null 2>&1
            if [ "$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "redroid booted"
              exit 0
            fi
            sleep 10
          done
          echo "::error::redroid did not boot in 10 minutes"
          docker logs nimo-redroid || true
          exit 1

      # The emulator binary needs system audio/GL libraries that some
      # runner images lack — without them qemu dies on startup with
      # "libpulse.so.0: cannot open shared object file" and the boot
      # step then burns 10 minutes retrying adb before timing out.
      - name: Install emulator system libraries
        if: steps.binder.outputs.available != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libgl1 libasound2t64 libnss3 libxss1 2>/dev/null \
            || sudo apt-get install -y -qq libpulse0 libgl1 libasound2

      # Cache the emulator system image between runs: the download is
      # ~1GB and dominates cold-boot time on the fallback path.
      - name: Cache Android system image
        if: steps.binder.outputs.available != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/system-images
          key: sysimg-${{ steps.env.outputs.api_level }}-${{ steps.env.outputs.target }}-x86_64

      # GitHub-hosted runners DO ship /dev/kvm, but the `kvm` group is empty
      # (`kvm:x:993:`), so the runner user cannot open it. The emulator then
      # probes KVM, fails, and starts with `-accel off`; a software-rendered
      # x86_64 image cannot finish booting inside the timeout, which is the
      # "Timeout waiting for emulator to boot" failure. Granting access is the
      # fix documented by reactivecircus/android-emulator-runner.
      - name: Enable KVM access
        if: steps.binder.outputs.available != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Informational only: never fail the run just because the probe is odd.
          ls -l /dev/kvm || echo "no /dev/kvm on this runner — emulator will be slow"

      # Cache the SDK pieces the emulator action would otherwise re-download
      # on every run. Measured in run #28: accepting licences, build-tools,
      # platform-tools, the emulator and the x86_64 system image cost 51s
      # before the AVD was even created -- a third of the pre-test setup.
      #
      # Safe by construction: a cache MISS leaves the action to install
      # everything exactly as it does today, so the worst case is the current
      # behaviour plus a failed lookup. Keyed on the API level and target, so
      # an APK that needs a different Android version gets its own entry
      # instead of a stale one.
      - name: Cache Android SDK + AVD
        if: steps.binder.outputs.available != 'true'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/system-images
            /usr/local/lib/android/sdk/emulator
            ~/.android/avd
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-api${{ steps.env.outputs.api_level }}-${{ steps.env.outputs.target }}-x86_64

      # NOTE: the emulator is killed when this step ends, so the whole
      # pipeline runs INSIDE the boot script while the device is alive.
      - name: Boot emulator and run pipeline (fallback)
        if: steps.binder.outputs.available != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.env.outputs.api_level }}
          target: ${{ steps.env.outputs.target }}
          arch: x86_64
          disable-animations: true
          # KVM is granted above, so keep hardware acceleration on; `auto`
          # would silently disable it again on any probe hiccup.
          disable-linux-hw-accel: false
          # -no-window is REQUIRED: the runner has no display, and emulator
          # 37.x aborts at startup ("no Qt platform plugin could be
          # initialized") if it tries to open a window. Overriding
          # emulator-options replaces the action's defaults, so it has to be
          # repeated here rather than inherited.
          #
          # -no-snapshot-load forces a clean boot: a cached AVD must never
          # let one run's app state leak into the next, which would make a
          # verdict depend on what ran before it.
          emulator-options: -no-window -no-snapshot-save -no-snapshot-load -noaudio -no-boot-anim -camera-back none -gpu swiftshader_indirect
          # NOTE: this action executes the script line-by-line, so the whole
          # invocation must be a single line (no backslash continuations).
          script: adb -s emulator-5554 wait-for-device && bash "$GITHUB_WORKSPACE/scripts/run_pipeline.sh" emulator emulator-5554 "${{ steps.env.outputs.android_version }}" "${{ steps.env.outputs.arch }}" "${{ inputs.max_minutes }}" "${{ inputs.mode }}" "${{ steps.bug.outputs.has_bug }}"

      - name: Run nimo pipeline (with live progress)
        if: steps.binder.outputs.available == 'true'
        run: |
          bash scripts/run_pipeline.sh redroid "$ANDROID_SERIAL" \
            "${{ steps.env.outputs.android_version }}" "${{ steps.env.outputs.arch }}" \
            "${{ inputs.max_minutes }}" "${{ inputs.mode }}" "${{ steps.bug.outputs.has_bug }}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimo-run-${{ github.run_id }}
          path: |
            out/
            summary.json
            pipeline.log

      - name: Teardown redroid
        if: always() && steps.binder.outputs.available == 'true'
        run: docker rm -f nimo-redroid || true
