name: demo

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install nimo
        run: pip install -q -e ".[apk]"

      - name: Preflight all demo APKs (no emulator needed)
        run: |
          for apk in demo/*/app.apk; do
            nimo preflight "$apk" || exit 2
          done

  repro:
    # Was macos-14, but GitHub resolves that to macos-14-arm64 (Apple
    # Silicon), where the x86_64 system image below cannot be hardware
    # accelerated and never finishes booting. Ubuntu + KVM (granted below)
    # is the accelerated x86_64 path and matches redroid-test.yml.
    runs-on: ubuntu-latest
    env:
      # Provider overrides, when the repo owner has configured them.
      NIMO_BASE_URL: ${{ secrets.NIMO_BASE_URL }}
      NIMO_API_KEY: ${{ secrets.NIMO_API_KEY }}
      NIMO_MODEL: ${{ secrets.NIMO_MODEL }}
      # With no provider secret there is no usable LLM: the free Pollinations
      # POST endpoint now answers 402 Payment Required (and 500 ENOSPC), so a
      # run against it fails for reasons unrelated to this repo. Fall back to
      # the deterministic backend, which drives the device / oracle / report
      # path end to end but does NOT exercise the model's reasoning. The run
      # log prints the backend in use, so a green job here can never be
      # mistaken for a reproduced bug.
      NIMO_BACKEND: ${{ secrets.NIMO_API_KEY == '' && 'null' || '' }}
    strategy:
      fail-fast: false
      matrix:
        demo:
          - { dir: 01-notepad,      package: bander.notepad }
          - { dir: 02-atimetracker, package: com.markuspage.android.atimetracker }
          - { dir: 03-asciicam,     package: com.dozingcatsoftware.asciicam }
          - { dir: 04-comicviewer,  package: net.androidcomics.acv }
          - { dir: 05-kiss,         package: fr.neamar.kiss.debug }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install nimo
        run: pip install -q -e ".[apk]"

      # /dev/kvm exists on GitHub-hosted runners but the `kvm` group is empty,
      # so without this the emulator falls back to -accel off and times out.
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no /dev/kvm on this runner — emulator will be slow"

      - name: Run repro agent on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-linux-hw-accel: false
          # NOTE: this action runs the script LINE BY LINE, so a backslash
          # continuation does not join lines -- `nimo repro \` executed on its
          # own and died with "the following arguments are required". Keep the
          # whole invocation on one line.
          script: |
            adb wait-for-device
            nimo repro --apk demo/${{ matrix.demo.dir }}/app.apk --package ${{ matrix.demo.package }} --bug demo/${{ matrix.demo.dir }}/bug_report.md --out out/${{ matrix.demo.dir }}/

      - name: Upload repro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-${{ matrix.demo.dir }}
          path: out/${{ matrix.demo.dir }}/
